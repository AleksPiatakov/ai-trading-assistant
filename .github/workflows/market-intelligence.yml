name: Market Intelligence — local MVP checks
on:
  push:
    branches:
      - market-intelligence-v1
    paths:
      - 'market-intelligence/**'
      - '.github/scripts/check-market-intelligence.mjs'
      - '.github/scripts/check-market-readiness.mjs'
      - '.github/scripts/check-market-forward-paper.mjs'
      - '.github/scripts/check-market-risk.mjs'
      - '.github/workflows/market-intelligence.yml'
      - 'scripts/market-scanner.mjs'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check market-intelligence/server.mjs
          node --check market-intelligence/market-scanner.mjs
          node --check market-intelligence/bybit-public.mjs
          node --check market-intelligence/app.js
          node --check .github/scripts/check-market-intelligence.mjs
          node --check .github/scripts/check-market-readiness.mjs
          node --check market-intelligence/forward-paper.mjs
          node --check market-intelligence/risk-policy.mjs
          node --check .github/scripts/check-market-risk.mjs
          node --check .github/scripts/check-market-forward-paper.mjs
      - name: Portfolio 1%/3% risk policy
        run: node .github/scripts/check-market-risk.mjs
      - name: Candidate readiness logic
        run: node .github/scripts/check-market-readiness.mjs
      - name: Market scanner unit and regression tests
        run: npm test --prefix market-intelligence
      - name: Forward-only paper-trading regression checks
        run: node .github/scripts/check-market-forward-paper.mjs
      - name: Offline startup and security checks
        run: node .github/scripts/check-market-intelligence.mjs
