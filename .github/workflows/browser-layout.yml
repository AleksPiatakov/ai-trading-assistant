name: Browser layout regression
on:
  push:
    branches: [redesign-approved-trading-ui]
    paths:
      - public/dashboard.html
      - .github/scripts/check-layout.mjs
      - .github/workflows/browser-layout.yml
      - .github/workflows/preview-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Produce static preview
        run: |
          mkdir -p _site
          cp public/dashboard.html _site/index.html
      - name: Start preview server
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/ata-web.log 2>&1 &
          sleep 2
      - name: Inspect visible panel bounds at desktop sizes
        run: node .github/scripts/check-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-ui-layout-screenshots
          path: layout-screenshots
