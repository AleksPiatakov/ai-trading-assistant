name: Publish visual preview (GitHub Pages)
# Rerun after allowing redesign branch in github-pages environment
# Re-run preview after Pages was enabled in repository settings
on:
  push:
    branches: [redesign-approved-trading-ui]
    paths:
      - public/dashboard.html
      - .github/workflows/preview-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trading-assistant-pages
  cancel-in-progress: true
jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static UI shell
        run: |
          mkdir -p _site
          cp public/dashboard.html _site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: trading-assistant-browser-preview
          path: _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
