name: Publish visual preview (GitHub Pages)
# Rerun after allowing redesign branch in github-pages environment
# Re-run preview after Pages was enabled in repository settings
on:
  push:
    branches: [redesign-approved-trading-ui]
    paths:
      - public/dashboard.html
      - .github/workflows/preview-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trading-assistant-pages
  cancel-in-progress: true
jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone visual preview
        run: |
          mkdir -p _site
          cp public/dashboard.html _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          text=p.read_text()
          # In a static visual preview, load clearly labeled sample candles.
          demo = """
          <script>
          (() => {
            window.__ATA_VISUAL_PREVIEW__ = true;
            const originalFetch = window.fetch.bind(window);
            window.fetch = async (input, init) => {
              if (String(input).startsWith('/api/market-data')) {
                const interval=new URL(String(input),location.origin).searchParams.get('interval')||'D';
                const intervals={'1':60000,'5':300000,'15':900000,'30':1800000,'60':3600000,'240':14400000,D:86400000,W:604800000};
                const units=intervals[interval]||intervals.D;
                const config={
                  '1':[1.6,190,85,0.28],
                  '5':[5.0,360,140,0.22],
                  '15':[9,570,180,0.19],
                  '30':[14,780,220,0.18],
                  '60':[23,1100,290,0.16],
                  '240':[38,1750,420,0.14],
                  D:[62,2850,520,0.12],
                  W:[85,4000,760,0.10]
                }[interval]||[62,2850,520,0.12];
                const [slope,amplitude,noise,frequency]=config;
                const lastTime=Date.UTC(2026,10,9,8,0);
                const baselineAt=i=>103730.44+(i-179)*slope+
                  amplitude*(Math.sin(i*frequency+interval.length)-Math.sin(179*frequency+interval.length))+
                  amplitude*.46*(Math.sin(i*frequency*.43+2)-Math.sin(179*frequency*.43+2));
                const candles=Array.from({length:180},(_,i)=>{
                  const t=lastTime-(179-i)*units;
                  const c=baselineAt(i),o=i===0?c-noise:baselineAt(i-1)+Math.sin(i*1.9)*noise;
                  const wick=80+noise*(.35+.65*Math.abs(Math.sin(i*.77+interval.length)));
                  return {t,o,c,h:Math.max(o,c)+wick,l:Math.min(o,c)-wick*.88,v:140+(i%13)*20+Math.round(Math.abs(Math.sin(i*.31+interval.length))*260)};
                });
                return new Response(JSON.stringify({candles,interval,updatedAt:Date.now(),source:'STATIC_VISUAL_PREVIEW'}),{status:200,headers:{'content-type':'application/json'}});
              }
              return originalFetch(input, init);
            };
          })();
          </script>
          """
          text=text.replace('<script>\n(function(){',demo+'<script>\n(function(){',1)
          text=text.replace('Bybit · linear · публічні свічки, без підключення рахунку','ВІЗУАЛЬНИЙ ПЕРЕГЛЯД · змодельований графік, не котирування')
          text=text.replace('Ринкові дані Bybit · ','ДЕМО-ДАНІ ДЛЯ ПЕРЕГЛЯДУ · ')
          text=text.replace('Ринкові дані: очікування','ДЕМО-ПЕРЕГЛЯД · не реальні дані')
          text=text.replace('Bybit: API не підключено','Bybit: не підключено · PREVIEW')
          text=text.replace('Публічні ринкові дані працюють окремо.','Графік змодельований для перегляду дизайну.')
          text=text.replace('Дані: публічні свічки Bybit','Дані: змодельований приклад для перегляду')
          text=text.replace('Джерело графіка: публічні свічки Bybit · категорія linear.','Джерело графіка: змодельовані дані в GitHub Pages Preview.')
          text=text.replace('</footer>','<span style="color:#ffd18c;font-size:10px">PREVIEW · Синтетичні свічки · Без зв’язку з рахунком Bybit · Ордери вимкнені</span></footer>',1)
          p.write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trading-assistant-browser-preview
          path: _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
